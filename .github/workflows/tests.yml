name: Quality checks

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: gd, pdo_pgsql, pdo_sqlite, sqlite3, mbstring, dom, fileinfo, curl, intl, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Prepare local environment
        run: php scripts/prepare-local.php

      - name: Check PHP platform
        run: composer check-platform-reqs

      - name: Build Assets
        run: npm run build

      - name: Run JavaScript tests
        run: npm test

      - name: Run PHP quality checks and tests
        run: composer test

      - name: Audit dependencies
        run: |
          composer audit
          npm audit
