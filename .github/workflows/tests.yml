name: Quality checks

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: gd, pdo_pgsql, pdo_sqlite, sqlite3, mbstring, dom, fileinfo, curl, intl, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Prepare local environment
        run: php scripts/prepare-local.php

      - name: Check PHP platform
        run: composer check-platform-reqs

      - name: Build Assets
        run: npm run build

      - name: Run JavaScript tests
        run: npm test

      - name: Run PHP quality checks and tests
        run: composer test

      - name: Audit dependencies
        run: |
          composer audit
          npm audit
